<title>HOA Wars</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: neon HOA entrance-sign header, one 40x26 board, rider status chips under it. */
:root {
  --bg: #0b0a1a;
  --ground: #141230;
  --panel: #17143a;
  --line: #2c2759;
  --veil: rgba(11, 10, 26, 0.78);
  --ink: #ece9fb;
  --muted: #9a96c4;
  --on-accent: #1a0618;

  --karen: #ff3da6;
  --karen-glow: rgba(255, 61, 166, 0.55);
  --gladys: #35e0ff;
  --doris: #ffd23d;
  --peggy: #7dff6a;

  --grass: #163a28;
  --grass-stripe: #19412c;
  --lawn: #1e4f37;
  --road: #232141;
  --walk: #3b3a5f;
  --walk-line: #2d2c4c;
  --stripe: #9b8a3c;
  --drive: #44426b;
  --roof-a: #4a3f7a;
  --roof-b: #3b4f86;
  --roof-c: #7a3f6c;
  --roof-d: #3f6b7a;
  --hoa: #d9d4f2;
  --window: #ffd27a;
  --leaf: #2a7a4b;
  --leaf-hi: #3fa86a;
  --mail: #ff5a5a;
  --fence: #e8e4f0;
  --fence-base: #1b1838;
  --water: #234f9e;
  --water-hi: #5f8fe0;
  --asphalt: #1c1a36;
  --field: #1d5a35;
  --concrete: #8a8ca6;
  --brick: #7a4a4a;

  --font-display: 'Monoton', 'Impact', sans-serif;
  --font-body: 'Figtree', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  padding-block: 20px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

header { display: flex; flex-direction: column; gap: 4px; }
.eyebrow { margin: 0; font: 600 12px var(--font-mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
h1 {
  margin: 0;
  font: 400 clamp(1.7rem, 7vw, 3.2rem) / 1.1 var(--font-display);
  color: var(--karen);
  text-shadow: 0 0 14px var(--karen-glow);
  text-wrap: balance;
}

.stage {
  position: relative;
  width: 100%;
  aspect-ratio: 40 / 26;
  max-width: 100%;
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
  background: var(--ground);
  touch-action: none;
}
canvas { display: block; width: 100%; height: 100%; }
/* a phone held upright: a tall game screen that shows fewer cells, so everything is bigger (the view size is set in fitView) */
@media (max-width: 720px) and (orientation: portrait) {
  .stage { aspect-ratio: 20 / 36; }
  /* the rider boxes sit on the bottom of the game screen, see-through */
  .play { position: relative; }
  .wrap .chips { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 1; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .wrap .chip { background: color-mix(in srgb, var(--panel) 22%, transparent); border-color: rgba(255, 255, 255, 0.14); text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9); }
}
.overlay {
  z-index: 2;
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
  background: var(--veil);
}
.card { max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.card p:empty { display: none; }
.card h2 { margin: 0; font-size: clamp(1.25rem, 4vw, 1.9rem); font-weight: 700; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); line-height: 1.45; font-size: clamp(0.85rem, 2.4vw, 1rem); }
.go {
  min-height: 44px; padding: 10px 24px;
  font: 700 1rem var(--font-body);
  color: var(--on-accent); background: var(--karen);
  border: 0; border-radius: 6px; cursor: pointer;
  box-shadow: 0 0 16px var(--karen-glow);
}
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

/* the leaderboard window after a round: a light veil, so the board stays visible underneath */
.overlay.win { background: rgba(11, 10, 26, 0.25); }
.overlay.win .card {
  width: min(400px, 100%); max-height: 100%; min-height: 0; gap: 8px; padding: 12px 14px;
  background: color-mix(in srgb, var(--panel) 62%, transparent); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 36px rgba(0, 0, 0, 0.55);
}
.overlay.win .card p { display: none; }
.lb { list-style: none; margin: 0; padding: 0; width: 100%; flex: 1 1 auto; min-height: 0; overflow-y: auto; font: 600 14px var(--font-body); text-align: left; }
.lb[hidden] { display: none; }
.lb li { display: grid; grid-template-columns: 2.4em 1fr auto; gap: 8px; align-items: center; padding: 3px 8px; white-space: nowrap; border-radius: 4px; }
.lb .lbr { color: var(--muted); font: 500 12px var(--font-mono); }
.lb .lbn { overflow: hidden; text-overflow: ellipsis; }
.lb li.me { color: #fff; background: rgba(255, 61, 166, 0.22); box-shadow: inset 0 0 0 1px var(--karen); }
.lb li.out { color: var(--muted); }

.chips { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.chip {
  display: grid; grid-template-columns: auto 1fr; column-gap: 8px; align-items: center;
  padding: 8px 10px; min-width: 0; container-type: inline-size;
  border: 1px solid var(--line); border-radius: 6px; background: var(--panel);
}
.dot { grid-row: 1 / span 3; width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.nm { grid-column: 2; grid-row: 2; font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
.meta { grid-column: 2; grid-row: 3; font: 500 12px var(--font-mono); color: var(--muted); }
.meta .cup { width: 11px; height: 16px; vertical-align: -3px; margin-right: 2px; }
.val { grid-column: 2; grid-row: 1; font: 700 1.1rem / 1.1 var(--font-body); font-size: max(14px, min(1.9rem, calc((100cqw - 46px) / 6.8))); font-variant-numeric: tabular-nums; color: var(--c); white-space: nowrap; }
.chip.out { opacity: 0.5; }
.chip.out .nm { text-decoration: line-through; }
.chip.win { border-color: var(--c); }


.foot { margin: 0; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; font: 500 12px var(--font-mono); color: var(--muted); }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Neighborhood HOA Simulator</p>
    <h1>HOA Wars</h1>
  </header>

  <div class="play">
  <div class="stage" id="stage">
    <canvas id="board" role="img" aria-label="Top-down view of the HOA Wars neighborhood with a hundred SUVs leaving glowing trails"></canvas>
    <div class="overlay" id="overlay" aria-live="polite">
      <div class="card">
        <h2 id="ovTitle">Ready to ride</h2>
        <p id="ovText"></p>
        <ol class="lb" id="ovBoard" aria-label="Leaderboard" hidden></ol>
        <button class="go" id="go" type="button">Start</button>
      </div>
    </div>
  </div>

  <ul class="chips" id="chips" aria-label="Riders"></ul>
  </div>

  <p class="foot"><span></span><span>v2.23</span></p>
</div>

<script>
(() => {
  let VW = 40, VH = 26; // how many cells the screen shows: wide on a computer, tall and closer in on a phone held upright
  const TW = 40, TH = 26, TX = 13, TY = 20, W = TW * TX, H = TH * TY, CELL = 24, TICK = 95, N = 100;
  // a small seeded random, so the same seed and the same turns give the same round on every screen
  const mulberry32 = (a) => () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  let rand = mulberry32(1);
  const DIRS = [{ x: 0, y: -1 }, { x: 1, y: 0 }, { x: 0, y: 1 }, { x: -1, y: 0 }]; // 0 up, 1 right, 2 down, 3 left
  const cs = getComputedStyle(document.documentElement);
  const tok = n => cs.getPropertyValue(n).trim();
  const C = {
    bg: tok('--bg'), ink: tok('--ink'), grass: tok('--grass'), grassStripe: tok('--grass-stripe'),
    road: tok('--road'), walk: tok('--walk'), walkLine: tok('--walk-line'), stripe: tok('--stripe'),
    lawn: tok('--lawn'), drive: tok('--drive'), hoa: tok('--hoa'), window: tok('--window'),
    leaf: tok('--leaf'), leafHi: tok('--leaf-hi'), mail: tok('--mail'),
    fence: tok('--fence'), fenceBase: tok('--fence-base'),
    doris: tok('--doris'), gladys: tok('--gladys'), line: tok('--line'), water: tok('--water'), waterHi: tok('--water-hi'), asphalt: tok('--asphalt'),
    field: tok('--field'), concrete: tok('--concrete'), brick: tok('--brick'), peggy: tok('--peggy'),
    roofs: [tok('--roof-a'), tok('--roof-b'), tok('--roof-c'), tok('--roof-d')]
  };

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const upright = matchMedia('(max-width: 720px) and (orientation: portrait)');
  function fitView() { VW = upright.matches ? 20 : 40; VH = upright.matches ? 36 : 26; canvas.width = VW * CELL; canvas.height = VH * CELL; }
  fitView(); upright.addEventListener('change', fitView);
  // upright phone: the rider boxes cover the bottom of the game screen, so the minimap sits above them (in canvas units)
  let chipPad = 0;
  function fitChips() { const c = document.getElementById('chips'); chipPad = upright.matches && canvas.clientWidth ? (c.offsetHeight + 10) * canvas.width / canvas.clientWidth : 0; }
  new ResizeObserver(fitChips).observe(document.getElementById('chips')); new ResizeObserver(fitChips).observe(canvas); upright.addEventListener('change', fitChips);

  // ---------- map ----------
  const solid = new Uint8Array(W * H);
  const kind = new Array(W * H).fill('');
  const trail = new Int16Array(W * H).fill(-1);
  // iced coffee: COFFEES cups on open cells; a rider can hold 2, and each one saves them from one hit (not a head-on)
  const COFFEES = 120;
  const coffee = new Uint8Array(W * H);
  const stepAt = new Int32Array(W * H);

  function block(x, y, w, h, k) {
    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) { solid[j * W + i] = 1; kind[j * W + i] = k; }
  }
  block(0, 0, W, 1, 'fence'); block(0, H - 1, W, 1, 'fence');
  block(0, 0, 1, H, 'fence'); block(W - 1, 0, 1, H, 'fence');

  // ---------- the town: every block is made from a fixed map seed, so the map is the same on every screen ----------
  // gen() returns paint (ground drawn under everything) and things (solid: houses, trees, water...) in the block's own cells
  function gen(kind, rng) {
    const P = [], T = [];
    const R = (a, c) => a + Math.floor(rng() * (c - a + 1));
    const roof = () => C.roofs[R(0, 3)];
    const house = (x, y, w, h, face, tone, hoa) => T.push({ k: hoa ? 'hoa' : 'house', x, y, w, h, face, tone: tone || roof(), hoa });
    const one = (k, x, y) => T.push({ k, x, y, w: 1, h: 1 });
    const rect = (k, x, y, w, h, more) => T.push(Object.assign({ k, x, y, w, h }, more));
    const oval = (k, cx, cy, rx, ry) => {
      const cells = [];
      for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++)
        if (x >= 0 && y >= 0 && x < TW && y < TH && ((x + 0.5 - cx) / rx) ** 2 + ((y + 0.5 - cy) / ry) ** 2 <= 1) cells.push([x, y]);
      T.push({ k, cx, cy, rx, ry, cells });
    };
    const yardTrees = () => { for (let i = R(2, 5); i > 0; i--) one('tree', R(1, 38), rng() < 0.5 ? 0 : 25); };
    const row = (y, h, face, from, to) => {
      for (let x = from; x <= to;) {
        const w = R(4, 6);
        if (x + w - 1 > to) break;
        if (rng() < 0.15) one('tree', x + 1, y + 1); else house(x, y, w, h, face);
        x += w + R(1, 2);
      }
    };
    const cars = (x0, x1, y, p) => { for (let x = x0; x <= x1; x += 2) if (rng() < p) rect('car', x, y, 1, 1, { tone: C.roofs[R(0, 3)] }); };
    if (kind === 'street' || kind === 'bright') {
      P.push(paintTile);
      row(2, 3, 'down', 2, 38); row(21, 3, 'up', 2, 38);
      if (rng() < 0.8) house(2, 9, 3, 6, 'right'); else one('tree', 3, 12);
      if (rng() < 0.8) house(35, 9, 3, 6, 'left'); else one('tree', 36, 12);
      const m = rng();
      if (m < 0.4) house(15, 11, 10, 4, 'down');
      else if (m < 0.7) { house(12, 11, 7, 4, 'down'); house(21, 11, 7, 4, 'down'); }
      else [[13, 12], [16, 11], [19, 13], [22, 11], [25, 12]].forEach(([x, y]) => one('tree', x, y));
      [[4, 5], [37, 5], [4, 20], [37, 20]].forEach(([x, y]) => one('bush', x, y));
      if (kind === 'bright') T.forEach(t => { if (t.k === 'house') t.tone = ['#e58fb8', '#7fb4e8', '#f0c75e', '#8fd18a'][R(0, 3)]; });
      yardTrees();
    } else if (kind === 'culdesac') {
      P.push(() => { strip(0, 11, 29, 14, C.road); disc(33.5, 12.5, 5.3, C.road); disc(33.5, 12.5, 1.7, C.lawn); walk(0, 10, 28, 10); walk(0, 15, 28, 15); });
      for (let x = 2; x <= 23; x += 7) { house(x, 4, 6, 4, 'down'); house(x, 18, 6, 4, 'up'); }
      house(30, 2, 6, 3, 'down'); house(30, 21, 6, 3, 'up');
      one('tree', 33, 12);
      yardTrees();
    } else if (kind === 'park') {
      P.push(() => { walk(0, 12, 39, 13); walk(19, 0, 20, 25); });
      const left = rng() < 0.5, top = rng() < 0.5;
      oval('pond', left ? 9 : 30, top ? 6 : 19.5, R(4, 6), 3);
      rect('play', left ? 28 : 8, top ? 18 : 4, 4, 2);
      for (let i = 0; i < 18; i++) {
        const x = R(1, 38), y = R(1, 24);
        if (y === 12 || y === 13 || x === 19 || x === 20) continue;
        if (Math.abs(x - (left ? 9 : 30)) < 8 && Math.abs(y - (top ? 6 : 19.5)) < 5) continue;
        one('tree', x, y);
      }
    } else if (kind === 'mall') {
      P.push(() => {
        lot(1, 8, 38, 23);
        b.strokeStyle = C.hoa; b.globalAlpha = 0.35; b.lineWidth = 1.5; b.beginPath();
        for (let x = 2; x <= 38; x += 2) { b.moveTo(x * CELL, 9.6 * CELL); b.lineTo(x * CELL, 11 * CELL); b.moveTo(x * CELL, 20 * CELL); b.lineTo(x * CELL, 21.4 * CELL); }
        b.stroke(); b.globalAlpha = 1;
      });
      rect('shop', 2, 1, 36, 5, { parts: R(3, 5), tone: roof() });
      cars(3, 37, 10, 0.4); cars(3, 37, 20, 0.4);
      one('tree', 1, 15); one('tree', 38, 15); one('bush', 20, 15);
    } else if (kind === 'school') {
      P.push(() => { lot(9, 10, 17, 21); field(21, 3, 37, 22); });
      rect('bldg', 2, 2, 16, 6, { tone: C.brick }); rect('bldg', 2, 8, 5, 9, { tone: C.brick });
      rect('bleach', 19, 7, 1, 12);
      cars(10, 16, 12, 0.5); cars(10, 16, 18, 0.5);
      for (let x = 2; x <= 17; x += 3) one('tree', x, 24);
    } else if (kind === 'hoa') {
      P.push(() => { walk(0, 5, 39, 5); walk(0, 20, 39, 20); court(2, 8, 10, 17); });
      house(15, 7, 10, 4, 'down', C.hoa, true);
      rect('pool', 15, 13, 10, 4);
      [[13, 8], [26, 8], [13, 15], [26, 15], [31, 10], [34, 14]].forEach(([x, y]) => one('tree', x, y));
      [[4, 5], [37, 5], [4, 20], [37, 20]].forEach(([x, y]) => one('bush', x, y));
    } else if (kind === 'plant') {
      // the edge of town: a power plant with two cooling towers and a fenced lot
      P.push(() => { lot(19, 16, 37, 23); lot(2, 11, 16, 16); });
      rect('bldg', 3, 3, 13, 7, { tone: C.concrete, stacks: true });
      oval('tower', 24, 8, 4, 4); oval('tower', 33.5, 8, 4, 4);
      rect('chain', 2, 19, 15, 1);
      [[5, 13], [8, 14], [12, 12]].forEach(([x, y]) => one('barrel', x, y));
      cars(20, 36, 17, 0.35); cars(20, 36, 22, 0.35);
    } else if (kind === 'square') {
      // town square: four streets, a plaza with a statue, big buildings on the corners
      P.push(() => {
        strip(0, 6, 39, 9, C.road); strip(0, 16, 39, 19, C.road); strip(6, 0, 9, 25, C.road); strip(30, 0, 33, 25, C.road);
        lot(11, 10, 28, 15, C.walk);
      });
      rect('statue', 19, 12, 2, 2);
      rect('bldg', 11, 1, 8, 4, { tone: C.concrete, dome: true }); rect('bldg', 21, 1, 7, 4, { tone: C.brick, steeple: true });
      rect('bldg', 11, 21, 8, 4, { tone: C.roofs[2] }); rect('bldg', 21, 21, 8, 4, { tone: C.roofs[3] });
      [[1, 1], [35, 1], [1, 21], [35, 21]].forEach(([x, y]) => rect('bldg', x, y, 4, 4, { tone: roof() }));
      [[12, 10], [27, 10], [12, 15], [27, 15]].forEach(([x, y]) => one('tree', x, y));
    } else if (kind === 'river') {
      P.push(() => { strip(0, 11, 39, 14, C.road); strip(17, 11, 22, 14, C.concrete); });
      rect('water', 17, 0, 6, 11); rect('water', 17, 15, 6, 11);
      row(2, 4, 'down', 2, 15); row(2, 4, 'down', 24, 38); row(19, 4, 'up', 2, 15); row(19, 4, 'up', 24, 38);
      [[16, 4], [23, 7], [16, 20], [23, 22]].forEach(([x, y]) => one('tree', x, y));
    }
    return { P, T };
  }
  // the subdivision: 13 by 20 blocks inside one outer fence; one block is the HOA club, six make the old town
  const HOA_TI = 9 * TX + 6;
  const OLD_TOWN = { '1,1': 'plant', '2,1': 'square', '3,1': 'school', '1,2': 'river', '2,2': 'bright', '3,2': 'mall' };
  const mapRand = mulberry32(19891217);
  const TILES = [];
  for (let ty = 0; ty < TY; ty++) for (let tx = 0; tx < TX; tx++) {
    const ti = TILES.length, roll = mapRand();
    const kind = ti === HOA_TI ? 'hoa' : OLD_TOWN[`${tx},${ty}`] ||
      (roll < 0.45 ? 'street' : roll < 0.7 ? 'culdesac' : roll < 0.85 ? 'park' : roll < 0.93 ? 'mall' : 'school');
    TILES.push({ ox: tx * TW, oy: ty * TH, kind, ...gen(kind, mulberry32((mapRand() * 4294967296) >>> 0)) });
  }
  TILES.forEach(({ ox, oy, T }) => T.forEach(t => {
    if (t.cells) t.cells.forEach(([x, y]) => block(ox + x, oy + y, 1, 1, t.k));
    else block(ox + t.x, oy + t.y, t.w, t.h, t.k);
  }));

  // ---------- riders ----------
  const GRANNY = ['Gladys', 'Doris', 'Peggy', 'Mildred', 'Edna', 'Bev', 'Marge', 'Agnes', 'Ethel', 'Dot', 'Lorraine',
    'Phyllis', 'Bernice', 'Myrtle', 'Hazel', 'Irene', 'Shirley', 'Bunny', 'Opal', 'Wanda'];
  const HAIR = ['#f1eefc', '#c7b2ff', '#e9e9ee', '#d8d0c4'];
  const riders = [];
  for (let i = 0; i < N; i++) {
    const nm = GRANNY[i % GRANNY.length], k = Math.floor(i / GRANNY.length);
    const name = k ? `${nm} ${k + 1}` : nm, color = `hsl(${(150 + i * 137.508) % 360} 90% 62%)`;
    riders.push({ name, color, baseName: name, baseColor: color, hair: HAIR[i % 4] });
  }
  riders.forEach((r, i) => Object.assign(r, {
    id: i, wins: 0, steps: 0, base: 0, shownVal: '', alive: true, path: [], turnQ: [],
    sx: 1, sy: 1, sdir: 0, x: 1, y: 1, px: 1, py: 1, dir: 0, boom: null, note: '', seed: 0
  }));
  // you are always Karen (pink); other real players are Karen 2, Karen 3... in their own colours
  let me = 0, karen = riders[0], wins = 0;

  let state = 'ready'; // ready | play | over
  let acc = 0, lastT = performance.now(), overlayTimer = 0, overlayShownAt = 0;

  function blocked(x, y) {
    return x < 0 || y < 0 || x >= W || y >= H || solid[y * W + x] === 1 || trail[y * W + x] >= 0;
  }
  function freeRun(x, y, d, max) {
    let n = 0;
    for (let k = 1; k <= max; k++) {
      if (blocked(x + DIRS[d].x * k, y + DIRS[d].y * k)) break;
      n++;
    }

  // the stats row above the minimap: round time, riders left, coffees held

    const all = standings(), mine = me >= 0 ? all.indexOf(karen) : -1;
    const rows = all.slice(0, 5).map((r, i) => [i + 1, r]);
    const gap = mine >= 5;
    if (gap) rows.push([mine + 1, karen]);
    const X = 14, Y = 10, W = 236, RH = 21, P = 8, H = P * 2 + 18 + rows.length * RH + (gap ? 6 : 0);
    ctx.save();
    if (upright.matches) ctx.scale(0.78, 0.78); // smaller panel on an upright phone
    ctx.fillStyle = 'rgba(11, 10, 26, 0.72)'; rr(ctx, X, Y, W, H, 8); ctx.fill();
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.font = '700 12px "Figtree", system-ui, sans-serif'; ctx.fillStyle = '#b9b5dd';
    ctx.fillText('HOA NEWSLETTER', X + P, Y + P + 7);
    ctx.font = '600 14px "Figtree", system-ui, sans-serif';
    rows.forEach(([rank, r], i) => {
      const y = Y + P + 18 + i * RH + RH / 2 + (gap && i === rows.length - 1 ? 6 : 0);
      ctx.fillStyle = r === karen && me >= 0 ? karen.color : r.alive ? '#ffffff' : 'rgba(255, 255, 255, 0.45)';
      ctx.textAlign = 'left'; ctx.fillText(String(rank), X + P, y); ctx.fillText(r.name, X + P + 26, y);
      ctx.textAlign = 'right'; ctx.fillText(money(r), X + W - P, y);
    });
    ctx.restore();
  }
  // property value: $19,000 for every step a rider has been alive since they took their granny over (about what it was by the clock)
  const riderValue = r => (r.steps - r.base) * 19000;
  // with no granny of your own yet, you see the number you ended on; it does not go up
  const karenValue = () => me < 0 ? heldVal : riderValue(karen);
  function updateValues() {
    const txt = '$' + karenValue().toLocaleString('en-US');
    if (txt !== kChip.shown) { kChip.val.textContent = txt; kChip.shown = txt; }
  }

  function frame(now) {
    const dt = Math.min(now - lastT, 100); lastT = now;
    if (state === 'play') {
      acc += dt;
      if (online) acc = Math.min(acc, TICK);
      else while (acc >= TICK && state === 'play') { acc -= TICK; step(); }
    }
    updateValues();
    draw(now);
    requestAnimationFrame(frame);
  }

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => pics.clear());
  reset(1, [0]); renderChips();
  requestAnimationFrame(frame);
})();
</script>
