name = "hoa-wars"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# v1 is what the live hoa-wars Worker already has (the old Lobby and Match).
# v2 deletes them, with their saved rounds, and adds the new Room.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby", "Match"]

[[migrations]]
tag = "v2"
deleted_classes = ["Lobby", "Match"]
new_sqlite_classes = ["Room"]
